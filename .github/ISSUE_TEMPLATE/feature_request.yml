name: Feature request
description: Anything that is not a protocol module — console, alerting, packaging, operations.
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        For a new protocol or decoy, use the "Protocol module or decoy" form
        instead. For a security problem, see
        [SECURITY.md](https://github.com/willysnow/wisp/blob/main/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Console UI
        - Alerting and notifications
        - Sensor behaviour or configuration
        - Packaging, deployment, or operations
        - Token service (callbacks, decoy documents)
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What you were trying to do, and where wisp got in the way. Describe the
        situation rather than the fix you have in mind — the fix is easier to
        judge once the problem is clear.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do

  - type: textarea
    id: alternatives
    attributes:
      label: What you are doing instead today
      description: A workaround, another tool, or nothing at all.

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: >-
        These are the properties the project is built on, and a change that
        breaks one will be turned down however good it otherwise is.
      options:
        - label: This does not require cgo, and does not stop the binaries being static and cross-compilable
        - label: This does not add a dependency the standard library could cover
        - label: This does not let a decoy grant access, execute anything, or make outbound connections an operator did not configure
