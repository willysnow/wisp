# wisp sensor configuration.
#
# Every key below is optional — omitting one keeps the built-in default, so the
# smallest useful config file is an empty one. Copy this to wisp.yaml to edit.

# Identifies this sensor in every emitted event.
node: wisp-01

# What this sensor pretends to be, on every port at once.
#
# Left to themselves the emulators describe a machine that cannot exist: an
# Ubuntu SSH daemon in front of an nginx serving a panel called
# "Administration", with a vsftpd underneath. Any one of those is convincing.
# Together they are a tell, because a real device on a real network is one
# product, and every port it answers says that product's name.
#
# Setting a persona renames the banners of ssh, http, https, ftp and telnet so
# an intruder who touches three ports gets three answers that agree. Available:
# ubuntu (the built-in default, so selecting it changes nothing), synology,
# qnap, truenas, hp-printer.
#
# It deliberately does not touch the cloud, container and CI decoys — a Synology
# NAS does not run a Kubernetes apiserver either, and dressing one up as the
# other would swap a small inconsistency for a larger one. A sensor running both
# sets is already describing two machines; run two sensors if that matters.
#
# Anything you set explicitly under `services:` wins over the persona, so you
# can take a whole device and then correct the one banner your environment needs
# differently.
#
# Off by default: the built-in banners are what every existing deployment
# already presents, and changing what a running sensor claims to be is a
# decision, not a default.
# device:
#   persona: synology
#   # Labels for this device. Empty takes them from the persona. When either is
#   # set they are stamped onto every event, so an alert says what the box was
#   # pretending to be without anyone looking up the deployment.
#   name: "nas-fileshare-02"
#   desc: "Synology DiskStation DS220j, DSM 7.2"

log:
  # JSONL event log. Set to "" to disable file output.
  file: events.jsonl
  # Mirror events to stdout in human-readable form.
  console: true

  # Forward events to a wisp console. Omit the URL to keep this sensor local.
  # remote:
  #   url: "https://console.internal:8000"
  #   token: "wisp_..."          # from `wisp-console sensor add <node>`
  #
  #   # A console with a self-signed certificate has to be trusted explicitly.
  #   # Pin the SHA-256 the console prints at startup (strongest), or point
  #   # ca_file at its certificate. Without one of these the connection fails,
  #   # which is the correct default.
  #   fingerprint: "51:49:55:A1:..."
  #   # ca_file: console-cert.pem
  #
  #   # Sends every captured credential and this sensor's own token to whoever
  #   # answers the connection. For the first ten minutes of a lab and nothing
  #   # else.
  #   # insecure_skip_verify: false

  # Forward every event to a syslog collector — a SIEM, a log shipper, or
  # anything else that already reads syslog. The message body is the same JSON
  # this sensor writes to events.jsonl, so whatever parses that parses this.
  #
  # Severity carries the meaning: credentials and stated intent arrive as
  # warnings, everything else as informational, so a collector can route on
  # level without parsing the body. Nothing is sent above warning — an
  # intrusion attempt on a honeypot is expected by design, and a sensor that
  # cried "critical" at every port scan would be filtered out within a week.
  # syslog:
  #   enabled: true
  #   address: "siem.internal:514"
  #   # udp, tcp, tcp+tls, unix, or unixgram. Use tcp+tls when the events cross
  #   # a network you do not own: they contain captured credentials.
  #   network: udp
  #   facility: local0
  #   tag: wisp
  #   # rfc5424 is the modern format. Use rfc3164 only for a collector that
  #   # cannot accept anything else — it has no year, and second-level
  #   # precision makes correlating an intrusion harder than it needs to be.
  #   format: rfc5424
  #   # auto uses octet counting over TLS (RFC5425 requires it) and newlines
  #   # elsewhere.
  #   framing: auto
  #   max_length: 8192
  #   # For tcp+tls, the same trust options as the console connection:
  #   # ca_file: collector-ca.pem
  #   # fingerprint: "AA:BB:..."

  # Publish to an hpfeeds broker — the pub/sub bus honeypot operators share
  # data over, and what OpenCanary, Cowrie and Dionaea speak when they feed a
  # shared collector. This is here so a wisp sensor can join an existing fleet
  # rather than sit beside one.
  #
  # The payload is the same JSON object events.jsonl holds, so a collector
  # pointed at both does not need two parsers.
  #
  # The secret is never sent: the broker announces a random nonce and the
  # client proves it knows the secret by hashing the two together. That
  # protects the credential and nothing else — the events themselves cross the
  # wire in the clear, and they contain captured passwords. Turn on tls for
  # anything leaving a network you own.
  # hpfeeds:
  #   enabled: true
  #   addr: "broker.internal:10000"
  #   ident: "wisp-01"
  #   secret: "..."
  #   channel: "wisp.events"
  #   tls: true
  #   # The same two ways of trusting a private certificate the console
  #   # connection offers, with the same precedence.
  #   # fingerprint: "AA:BB:..."
  #   # ca_file: broker-ca.pem

  # How much disk the event log may take.
  #
  # The rate limit below stops a flood arriving faster than the disk can take
  # it. It does not stop a year of ordinary traffic from filling the partition,
  # and a sensor whose disk is full stops recording the intrusion that filled
  # it. Rotation is by rename, oldest first: events.jsonl.5 is removed, .4
  # becomes .5, and the live file becomes .1 — so events.jsonl is always the
  # one to tail.
  #
  # The defaults below bound a fresh install at roughly half a gigabyte. Set
  # max_size_mb to -1 if logrotate or journald already manages this file; two
  # rotators fighting over one file is worse than either alone.
  rotate:
    max_size_mb: 100
    max_files: 5

  # How much this sensor will record. Without a limit, an attacker who
  # identifies the honeypot chooses how much you write: hold the port open and
  # the sensor fills its own disk and buries the console under deliveries.
  #
  # Suppressed events are counted and reported as a `rate_limited` event, so a
  # flood still shows up as a flood. All values are events per minute; a burst
  # is how many may arrive at once, so a port scan touching every service lands
  # in full.
  rate_limit:
    enabled: true
    per_source_per_minute: 60
    per_source_burst: 30
    # Credentials and stated intent (login_password, prompt, tool_call, …) get
    # their own budget, so a flood of bare connections cannot crowd out the one
    # password that matters.
    high_value_per_minute: 30
    high_value_burst: 60
    # The whole sensor, across every source — the backstop for a distributed
    # scan where no single address trips its own limit.
    global_per_minute: 600
    global_burst: 300

services:
  # Ports are unprivileged by default so wisp runs without elevation. To catch
  # scans on the real ports, redirect at the firewall (22 -> 2222) or map them
  # in Docker. Ports that are already unprivileged sit on their true numbers.

  ssh:
    enabled: true
    addr: "0.0.0.0:2222"
    # Presented to clients. Match it to the OS you are pretending to be — a
    # Ubuntu banner on a box that fingerprints as Windows is a giveaway.
    banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.10"
    # Generated on first run if absent. Keep it: a host key that changes every
    # restart identifies the box as a honeypot to anyone who revisits.
    host_key: hostkey.pem

  http:
    enabled: true
    addr: "0.0.0.0:8080"
    server_header: "nginx/1.18.0 (Ubuntu)"
    # realm titles the login page; footer is the firmware line beneath the form.
    # Both are what make a fake panel look like a particular device rather than
    # a generic one, which is why `device.persona` sets them.
    realm: "Administration"
    footer: "Firmware 2.1.14"

  # The same admin panel behind TLS, reported as its own service so you can
  # tell which door was tried. It is a separate listener rather than a redirect
  # because a scanner sweeping 443 never touches 80.
  https:
    enabled: true
    addr: "0.0.0.0:8443"
    server_header: "nginx/1.18.0 (Ubuntu)"
    realm: "Administration"
    footer: "Firmware 2.1.14"
    # Generated on first run if absent. Keep them: a certificate that changes
    # every restart is a honeypot fingerprint, and the SANs are part of what an
    # attacker sees when they look at what this box claims to be.
    cert: https-cert.pem
    key: https-key.pem
    # names: ["vpn.corp.example.com", "10.0.0.20"]

  telnet:
    enabled: true
    addr: "0.0.0.0:2323"
    banner: "Ubuntu 22.04.3 LTS"

  ftp:
    enabled: true
    addr: "0.0.0.0:2121"
    banner: "(vsFTPd 3.0.5)"

  redis:
    # Answers +OK so a scripted takeover runs its whole playbook in your log.
    # Nothing is stored and nothing executes.
    enabled: true
    addr: "0.0.0.0:6379"
    version: "7.0.15"

  tftp:
    enabled: true
    addr: "0.0.0.0:6969"

  ntp:
    # Answers ordinary client requests; never answers mode 7 (monlist), which
    # would make this sensor a DDoS amplifier.
    enabled: true
    addr: "0.0.0.0:1123"

  ollama:
    # 11434 is Ollama's real default and is unprivileged, so this one can sit on
    # its true port with no redirect.
    enabled: true
    addr: "0.0.0.0:11434"
    version: "0.5.4"

  # An MCP server. Records which agent connected — its own clientInfo, which is
  # a far stronger identifier than a user agent — and the arguments of every
  # tool call it made. The advertised tools are deliberately tempting; the one
  # they reach for tells you what they were after.
  mcp:
    enabled: true
    # MCP has no standard port. 8931 avoids the crowded dev-server range;
    # change it to match whatever your real servers use.
    addr: "0.0.0.0:8931"
    # What the decoy calls itself during `initialize`. Make it sound like
    # something your organisation would actually run.
    server_name: "internal-tools"
    version: "1.4.2"

  # The Kubernetes API server. Answers 403 rather than 401, which is what an
  # anonymous-auth-enabled cluster does: 401 reads as "wrong door" and ends the
  # interaction, while 403 reads as "right door, wrong credentials" — so the
  # attacker retries with a stolen bearer token, and the token lands in the log.
  k8s:
    # 6443 is the apiserver's real port and is unprivileged.
    enabled: true
    addr: "0.0.0.0:6443"
    version: "v1.29.4"
    # Generated on first run if absent. Keep them: a certificate that changes
    # every restart is a honeypot fingerprint.
    cert: k8s-cert.pem
    key: k8s-key.pem

  # The kubelet — the more useful of the two Kubernetes ports to an intruder. A
  # kubelet that trusts anonymous requests lists every pod on the node and then
  # runs a command inside any of them, no cluster credential involved. The
  # command they submit is the capture that matters; nothing is executed.
  kubelet:
    enabled: true
    addr: "0.0.0.0:10250"
    # Appears in the certificate subject, the pod specs, and the fabricated
    # command output. Empty means this machine's hostname.
    node_name: ""
    cert: kubelet-cert.pem
    key: kubelet-key.pem

  # The Docker Engine API. An exposed socket is not a vulnerability, it is a
  # shell: anyone who reaches it can create a container that bind-mounts the
  # host's root filesystem and start it. The captured container specification
  # says exactly that, and the `escape` field names why.
  docker:
    # 2375 is the plaintext port — the one that gets attacked. 2376 is the TLS
    # one, and nobody is breached through it.
    enabled: true
    addr: "0.0.0.0:2375"
    version: "24.0.7"
    api_version: "1.43"

  # Cloud instance metadata — the same 169.254.169.254 on every cloud, serving
  # AWS, GCP and Azure from one listener. There is no benign reason for an
  # unfamiliar process to ask it for role credentials, which makes this one of
  # the few honeypot signals with almost no false-positive story.
  #
  # To make it answer on the real address, add the link-local IP and redirect:
  #
  #   ip addr add 169.254.169.254/32 dev lo
  #   iptables -t nat -A PREROUTING -d 169.254.169.254 -p tcp --dport 80 \
  #       -j REDIRECT --to-port 8169
  #
  # DO NOT do that on a machine that is itself a cloud instance. You would
  # shadow the real metadata service, and everything on the box that needs
  # credentials would start receiving fabricated ones.
  imds:
    enabled: true
    addr: "0.0.0.0:8169"
    # The fabricated identity. Match these to the organisation being imitated —
    # an instance in us-east-1 running prod-app-instance-role is unremarkable
    # in one company and obviously fake in another.
    region: "us-east-1"
    role: "app-instance-role"

  # Elasticsearch, emulated wide open — which is what the installed base looks
  # like and what makes an intruder send a query instead of a password. The
  # query is the artifact: it names the fields they wanted and how many rows.
  # Nothing is stored, nothing is deleted, every index is fictional.
  elasticsearch:
    enabled: true
    addr: "0.0.0.0:9200"
    # 8.x has security on by default, so a wide-open 8.x cluster is slightly
    # implausible. 7.x is the single most common thing on port 9200.
    version: "7.17.9"
    cluster_name: "elasticsearch"

  # A Jenkins controller, complete with the Groovy script console that turns
  # read access into code execution. The submitted script is recorded and never
  # evaluated — there is no interpreter here.
  jenkins:
    # Jenkins' own default is 8080, which the http decoy already has.
    enabled: true
    addr: "0.0.0.0:8081"
    version: "2.440.3"

  # GitLab. Captures stolen personal access tokens the way the k8s decoy
  # captures stolen service-account tokens: public endpoints answer so there is
  # somewhere to point the token, and everything else returns GitLab's own
  # 401. No token is ever accepted.
  gitlab:
    enabled: true
    addr: "0.0.0.0:8929"
    version: "16.11.2"

  git:
    # 9418 is git's own port and is unprivileged. A git client states the full
    # repository path in its first packet, so the request alone tells you what
    # naming the intruder already knows.
    enabled: true
    addr: "0.0.0.0:9418"

  mongodb:
    # Emulated with authentication enabled, which is what makes a scanner offer
    # credentials instead of simply reading. Modern drivers then run SCRAM: the
    # username arrives in the clear and the client's proof can be attacked
    # offline. Nothing is ever accepted.
    enabled: true
    addr: "0.0.0.0:27017"
    version: "7.0.14"

  mysql:
    # Emulated with authentication required, which is what makes a client hand
    # over its password response instead of simply querying. The server issues a
    # random scramble and the client answers with a value keyed by the password;
    # recorded together they crack offline as hashcat mode 11200. The decoy
    # advertises mysql_native_password (and switches a caching_sha2 client to it)
    # because that plugin's response is the one a wordlist can attack. Nothing is
    # ever accepted; every login ends in access denied.
    enabled: true
    # 3306 is MySQL's real port and is already unprivileged, so no redirect.
    addr: "0.0.0.0:3306"
    # The server build reported in the handshake — the first thing a client and
    # every fingerprinting tool reads.
    version: "8.0.36"

  mssql:
    # A Microsoft SQL Server, emulated through the TDS handshake. The decoy tells
    # the client it cannot do TLS, so a willing client sends its LOGIN7 — password
    # included — in the clear. A TDS password is only lightly obfuscated, not
    # hashed, so unlike the other database decoys this one recovers the cleartext
    # password itself. A client that requires encryption or uses Windows auth is
    # recorded as an attempt but yields no password. Every login ends in error
    # 18456, the code for a failed login.
    enabled: true
    # 1433 is SQL Server's real port and is already unprivileged.
    addr: "0.0.0.0:1433"
    version: "16.0.1000"
    # What the server calls itself in the login-error token — the @@SERVERNAME a
    # client reads back. Match it to the device persona.
    server_name: "SQLSERVER"

  # An SMB2/3 file server, emulated through the NTLM handshake — the native
  # answer to the one thing OpenCanary needs an external Samba install with a
  # full_audit VFS module to do. A client that reaches a share authenticates
  # with NTLMv2 first, so the server issues a challenge and the client answers
  # with a value that cracks offline: the capture is a NetNTLMv2 hash and the
  # account name, ready for hashcat mode 5600. Nothing is ever accepted; every
  # authentication ends in a logon failure, so no share is ever served.
  smb:
    enabled: true
    # 445 is privileged, so wisp binds an unprivileged port by default and you
    # redirect 445 to it — the same pattern as ssh on 2222:
    #
    #   iptables -t nat -A PREROUTING -p tcp --dport 445 -j REDIRECT --to-port 4445
    #
    # Windows itself holds 445 open, so on a Windows sensor this decoy is for a
    # segment reached through that redirect rather than the host's own port.
    addr: "0.0.0.0:4445"
    # What the server calls itself in the NTLM challenge — the name an intruder
    # sees on 445. The device persona sets these, so a NAS answers SMB as the
    # same box its web UI claims to be. NetBIOS names are uppercase, <=15 chars.
    computer_name: "FILESERVER"
    domain_name: "WORKGROUP"

  vnc:
    # An RFB server that offers only VNC Authentication — never "None" — so a
    # client has to return the DES challenge-response. The server sends a random
    # challenge and records it next to the response; together they crack offline
    # with John the Ripper's `vnc` format. Unlike a banner catcher on 5900, this
    # captures a credential rather than just the connection. Every attempt ends
    # in a security-result failure.
    enabled: true
    # 5900 is VNC's real port and is already unprivileged.
    addr: "0.0.0.0:5900"
    # The RFB protocol version offered first, which decides the security
    # handshake. "3.8", "3.7" and "3.3" are the ones in the wild.
    version: "3.8"

  sip:
    # A VoIP server on UDP, the protocol sipvicious and friendly-scanner sweep
    # for. It answers OPTIONS with 200 OK — which is how svmap decides a PBX is
    # live and escalates to guessing — and challenges REGISTER with a digest
    # nonce it records. When the client answers with an Authorization digest, the
    # pieces a cracker needs are captured together as a hashcat-11400 line. Every
    # credential ends in 403 Forbidden.
    enabled: true
    # 5060/udp is SIP's real port and is already unprivileged.
    addr: "0.0.0.0:5060"
    # The realm the client folds into its digest (part of what makes the capture
    # crackable) and the PBX product the decoy names.
    realm: "asterisk"
    server: "Asterisk PBX 18.10.0"

  http_proxy:
    # An HTTP forward proxy — what an intruder scans for to borrow someone else's
    # egress. It records where the client wanted to go (a CONNECT target or an
    # absolute-form URL, which catches SSRF pivots and open-proxy checks) and
    # answers 407 to capture cleartext Proxy-Authorization credentials. It never
    # opens an outbound connection, so it is a sensor, not an actual relay.
    enabled: true
    # 3128 is Squid's default port and is already unprivileged.
    addr: "0.0.0.0:3128"
    server_header: "squid/5.7"
    realm: "Squid proxy-caching web server"

  snmp:
    # An SNMP agent on UDP. In v1 and v2c the community string is the credential,
    # sent in the clear on every request, and this is what onesixtyone and
    # snmpwalk spray: "public", "private", the vendor defaults. The decoy records
    # every community, the operation, and the OIDs — a SetRequest is an attempt to
    # reconfigure the device. It never answers: SNMP is the internet's favourite
    # UDP amplification protocol, and a GETBULK reply can dwarf its request, so an
    # agent that responded could be turned into a reflector. Capturing the
    # community needs no reply — it is in the request.
    enabled: true
    # 161/udp is privileged, so wisp binds an unprivileged port by default and you
    # redirect 161 to it — the same pattern as ntp on 1123:
    #
    #   iptables -t nat -A PREROUTING -p udp --dport 161 -j REDIRECT --to-port 1161
    addr: "0.0.0.0:1161"

  # LLMNR poisoning detection — the one module that is not a decoy, and the one
  # that sends traffic of its own.
  #
  # It multicasts a query for a hostname that does not exist. A correct network
  # answers with silence; Responder, Inveigh, and every other relay tool answer
  # everything, because answering everything is how they work. One reply is
  # proof of an active attacker, from an address that names their machine.
  #
  # It never answers an LLMNR query — doing so would be poisoning your own
  # network, which is the attack this detects.
  #
  # Off by default: a sensor should not start putting packets on a network
  # without someone deciding it should.
  llmnr:
    enabled: false
    # The local socket probes go out from. An ephemeral port is right unless
    # you need a fixed one for a firewall rule.
    addr: "0.0.0.0:0"
    # Empty means a fresh random hostname per probe, which is the better
    # default: a fixed name is one an attacker who has seen it before can teach
    # their tool to ignore.
    hostname: ""
    interval: 5m
    splay: 1m

  # Generic TCP catchers for ports that do not warrant a full emulator yet. They
  # record the first bytes a client sends — enough to see a scan, but they
  # cannot capture credentials. Name each one after whatever it is pretending
  # to be; that name appears in the alert. Where a real emulator exists (vnc,
  # mysql, mssql, mongodb, …), prefer it — it captures credentials this cannot.
  banners:
    - enabled: true
      # RDP has no real emulator yet: X.224 alone catches the connection, but
      # capturing a hash needs NLA/CredSSP. The catcher sends nothing (RDP has
      # no greeting) and records the client's X.224 connection request.
      name: rdp
      addr: "0.0.0.0:3389"
      banner: ""
